<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .dashboard {
            background: #0a0a0a;
            border: 2px solid #00ff00;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }
        
        .status-badge {
            padding: 5px 10px;
            background: #1a1a1a;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .status-badge.online { color: #00ff00; }
        .status-badge.offline { color: #ff4444; }
        .status-badge.warning { color: #ffaa44; }
        
        .terminal {
            background: #0a0a0a;
            border: 2px solid #00ff00;
            margin: 20px 0;
        }
        
        .terminal-header {
            color: #00ff00;
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            background: #0a0a0a;
        }
        
        .terminal-output {
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            padding: 10px;
            background: #0a0a0a;
        }
        
        .terminal-line {
            padding: 3px 0;
            font-family: 'Courier New', monospace;
            border-bottom: 1px solid #1a1a1a;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .terminal-line.error { color: #ff6666; }
        .terminal-prompt { color: #00ff00; margin-right: 10px; }
        
        .terminal-input-line {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #333;
            padding: 10px;
            background: #0a0a0a;
        }
        
        .terminal-input-line span { color: #00ff00; font-weight: bold; }
        
        .terminal-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .terminal-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }
        
        .terminal-send {
            background: #00ff00;
            border: none;
            color: #0a0a0a;
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        .terminal-send:hover { background: #44ff44; }
        
        h2 { margin-bottom: 15px; font-size: 16px; }
        .status-info { font-size: 11px; color: #888; margin-top: 5px; }
        .command-hint { background: #1a1a1a; padding: 8px; margin-top: 10px; font-size: 11px; color: #888; border-left: 3px solid #00ff00; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="dashboard">
            <h2>🖥️ ADMIN CONSOLE v3.0</h2>
            <div class="status">
                <div class="status-badge online" id="apiGatewayStatus">🟢 API Gateway: ONLINE</div>
                <div class="status-badge" id="queueStatus">📦 Очередь: 0</div>
                <div class="status-badge" id="cacheStatus">💾 Кеш: OK</div>
                <div class="status-badge" id="vpnStatus">🌐 VPN check: OFF</div>
            </div>
            <div class="status-info" id="dayInfo">День 1 | Ожидание решения</div>
            
            <div class="terminal">
                <div class="terminal-header">
                    ⚡ SYSTEM TERMINAL v2.0 | Введите "help" для списка команд
                </div>
                <div class="terminal-output" id="terminalOutput">
                    <div class="terminal-line"><span class="terminal-prompt">$></span> Терминал готов. Введите "help"</div>
                </div>
                <div class="terminal-input-line">
                    <span>$></span>
                    <input type="text" id="terminalInput" class="terminal-input" placeholder="Введите команду..." autocomplete="off">
                    <button id="terminalSendBtn" class="terminal-send">ENTER</button>
                </div>
            </div>
            
            <div class="command-hint">
                💡 Подсказка: введите "help" чтобы увидеть все доступные команды для текущего дня
            </div>
        </div>
    </div>
    
    <script>
        // Функция для добавления текста в терминал
        function addToTerminal(text, isError) {
            const terminal = document.getElementById('terminalOutput');
            if (!terminal) return;
            
            const line = document.createElement('div');
            line.className = 'terminal-line' + (isError ? ' error' : '');
            line.innerHTML = `<span class="terminal-prompt">$></span> ${text}`;
            terminal.appendChild(line);
            line.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
        
        // Функция для отправки команды в родительское окно
        function sendCommand() {
            const input = document.getElementById('terminalInput');
            const command = input.value.trim();
            
            if (!command) return;
            
            // Добавляем команду в терминал
            addToTerminal(command, false);
            
            // Отправляем команду в родительское окно
            if (window.parent && window.parent.postMessage) {
                window.parent.postMessage({
                    type: 'terminalCommand',
                    command: command
                }, '*');
                console.log("Command sent:", command);
            } else {
                addToTerminal('❌ Ошибка: не удалось отправить команду', true);
            }
            
            input.value = '';
        }
        
        // Обновление статуса
        function updateStatus() {
            // Запрашиваем данные у родителя
            if (window.parent && window.parent.getGameData) {
                const gameData = window.parent.getGameData();
                if (gameData) {
                    const dayInfo = document.getElementById('dayInfo');
                    const apiStatus = document.getElementById('apiGatewayStatus');
                    const queueStatus = document.getElementById('queueStatus');
                    const cacheStatus = document.getElementById('cacheStatus');
                    const vpnStatus = document.getElementById('vpnStatus');
                    
                    const completedDays = gameData.completedDays || [];
                    
                    dayInfo.innerHTML = `День ${gameData.day} | Решено дней: ${completedDays.length}/5 | ❤️ Доверие: ${gameData.trust} | 🧠 Интеллект: ${gameData.intellect}`;
                    
                    if (gameData.day === 1 && !completedDays.includes(1)) {
                        apiStatus.innerHTML = '🟡 API Gateway: DEGRADED';
                        apiStatus.className = 'status-badge warning';
                        queueStatus.innerHTML = '📦 Очередь: ПЕРЕПОЛНЕНА';
                        queueStatus.className = 'status-badge warning';
                    } else if (gameData.day === 2 && !completedDays.includes(2)) {
                        apiStatus.innerHTML = '🔴 API Gateway: OFFLINE (502)';
                        apiStatus.className = 'status-badge offline';
                        queueStatus.innerHTML = '📦 Очередь: 15';
                    } else if (gameData.day === 3 && !completedDays.includes(3)) {
                        apiStatus.innerHTML = '🟢 API Gateway: ONLINE';
                        apiStatus.className = 'status-badge online';
                        cacheStatus.innerHTML = '⚠️ Кеш: УСТАРЕЛ';
                        cacheStatus.className = 'status-badge warning';
                    } else if (gameData.day === 4 && !completedDays.includes(4)) {
                        apiStatus.innerHTML = '🟡 API Gateway: НЕСТАБИЛЕН';
                        apiStatus.className = 'status-badge warning';
                        vpnStatus.innerHTML = '🌐 VPN check: АКТИВЕН';
                        vpnStatus.className = 'status-badge warning';
                    } else {
                        apiStatus.innerHTML = '🟢 API Gateway: ONLINE';
                        apiStatus.className = 'status-badge online';
                        queueStatus.innerHTML = '📦 Очередь: 0';
                        queueStatus.className = 'status-badge online';
                        cacheStatus.innerHTML = '💾 Кеш: OK';
                        cacheStatus.className = 'status-badge online';
                        vpnStatus.innerHTML = '🌐 VPN check: OFF';
                        vpnStatus.className = 'status-badge online';
                    }
                }
            }
        }
        
        // Слушаем ответы от родителя
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'terminalResponse') {
                addToTerminal(event.data.text, event.data.isError);
            }
        });
        
        // Инициализация
        function init() {
            updateStatus();
            setInterval(updateStatus, 1000);
            
            const sendBtn = document.getElementById('terminalSendBtn');
            const input = document.getElementById('terminalInput');
            
            if (sendBtn) sendBtn.addEventListener('click', sendCommand);
            if (input) input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendCommand();
            });
        }
        
        init();
        
        // Экспортируем функцию для внешнего использования
        window.addToTerminal = addToTerminal;
    </script>
</body>
</html>
