<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #fff4de;
        }
        
        .diary-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .warning-banner {
            background: #ff6600;
            color: white;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            box-shadow: inset -2px -2px 0 #aa4400, inset 2px 2px 0 #ffaa66;
        }
        
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffee;
            margin-bottom: 20px;
            border: 4px solid #ffaa44;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .grades-table th, .grades-table td {
            border: 2px solid #ffaa44;
            padding: 12px;
            text-align: left;
        }
        
        .grades-table th {
            background: #ffaa44;
            color: #442200;
            font-family: 'Courier New', monospace;
        }
        
        .grade-2 {
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
        }
        
        .grade-5 {
            color: #27ae60;
            font-weight: bold;
            font-size: 18px;
        }
        
        .schedule-section {
            background: #ffffee;
            padding: 15px;
            margin: 20px 0;
            border: 4px solid #ffaa44;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .schedule-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #442200;
            background: #ffcc77;
            display: inline-block;
            padding: 6px 12px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            box-shadow: inset -2px -2px 0 #aa7733, inset 2px 2px 0 #ffeedd;
        }
        
        .schedule-item {
            background: #ffeedd;
            margin: 10px 0;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px solid #ffaa44;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .schedule-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .schedule-name {
            font-weight: bold;
            color: #442200;
            font-size: 14px;
        }
        
        .schedule-time {
            font-size: 11px;
            color: #886633;
        }
        
        .mark-btn {
            background: #ffaa44;
            color: #442200;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            box-shadow: inset -2px -2px 0 #aa7733, inset 2px 2px 0 #ffeedd;
            transition: all 0.1s ease;
        }
        
        .mark-btn:hover:not(:disabled) {
            background: #ffcc66;
            transform: scale(1.02);
        }
        
        .mark-btn:active:not(:disabled) {
            box-shadow: inset -2px -2px 0 #ffeedd, inset 2px 2px 0 #aa7733;
        }
        
        .mark-btn.marked {
            background: #27ae60;
            color: white;
            box-shadow: inset -2px -2px 0 #1a6e3a, inset 2px 2px 0 #6ecc8e;
            cursor: default;
            pointer-events: none;
        }
        
        .message-area {
            margin-top: 20px;
            background: #ffffee;
            padding: 15px;
            border: 4px solid #ffaa44;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .message-area h3 {
            margin-bottom: 10px;
            color: #442200;
            font-size: 14px;
        }
        
        .system-message {
            background: #ffeedd;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 2px solid #ffaa44;
            clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
        }
        
        .intellect-tip {
            background: #ffeedd;
            padding: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #442200;
            font-weight: bold;
            border: 2px solid #ffaa44;
            clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
        }
        
        h2 {
            color: #442200;
            margin-bottom: 15px;
            font-size: 18px;
            background: #ffcc77;
            display: inline-block;
            padding: 6px 12px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            box-shadow: inset -2px -2px 0 #aa7733, inset 2px 2px 0 #ffeedd;
        }
        
        .error-403 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            background: #fff0e0;
            border: 4px solid #ffaa44;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
            padding: 40px;
        }
        
        .error-403-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-403-title {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        
        .error-403-text {
            font-size: 14px;
            color: #886633;
        }
        
        @keyframes btnPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .mark-btn.marked {
            animation: btnPulse 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="diary-container" id="diaryContainer"></div>
    
    <script>
        // Глобальные переменные
        let currentDay = 1;
        let buttonHandlersAttached = false;
        
        function getGameData() {
            return window.parent.getGameData ? window.parent.getGameData() : null;
        }
        
        function updateGameData(data) {
            if (window.parent.updateGameData) {
                window.parent.updateGameData(data);
            }
        }
        
        function showBubble(text, type) {
            if (window.parent.showBubble) {
                window.parent.showBubble(text, type);
            }
        }
        
        function updateParentStats() {
            if (window.parent.updateStatsDisplay) {
                window.parent.updateStatsDisplay();
            }
        }
        
        function modifyIntellectLocally(delta) {
            const gameData = getGameData();
            if (gameData) {
                gameData.intellect = (gameData.intellect || 0) + delta;
                updateGameData(gameData);
                updateParentStats();
            }
        }
        
        function isLKAccessible() {
            const gameData = getGameData();
            if (gameData && gameData.day >= 4 && !gameData.completedDays?.includes(4)) {
                return !gameData.vpnEnabled;
            }
            return true;
        }
        
        function getTodaySchedule() {
            const gameData = getGameData();
            const day = gameData?.day || 1;
            currentDay = day;
            
            const schedules = {
                1: [
                    { name: "Программирование", time: "10:00-11:30", reward: 10 },
                    { name: "Математика", time: "12:00-13:30", reward: 8 },
                    { name: "Английский язык", time: "14:00-15:30", reward: 5 }
                ],
                2: [
                    { name: "Базы данных", time: "10:00-11:30", reward: 10 },
                    { name: "Веб-разработка", time: "12:00-13:30", reward: 12 },
                    { name: "Физика", time: "14:00-15:30", reward: 5 }
                ],
                3: [
                    { name: "Операционные системы", time: "10:00-11:30", reward: 12 },
                    { name: "Компьютерные сети", time: "12:00-13:30", reward: 10 }
                ],
                4: [
                    { name: "Тестирование ПО", time: "10:00-11:30", reward: 8 },
                    { name: "Английский язык", time: "13:00-14:30", reward: 5 },
                    { name: "Математика", time: "15:00-16:30", reward: 8 }
                ],
                5: [
                    { name: "Дипломное проектирование", time: "10:00-11:30", reward: 15 },
                    { name: "Карьера в IT", time: "12:00-13:30", reward: 10 }
                ],
                6: [
                    { name: "Защита курсовой", time: "10:00-12:00", reward: 20 }
                ]
            };
            
            return schedules[day] || schedules[1];
        }
        
        function isLessonMarked(lessonName) {
            const savedKey = `marked_${currentDay}_${lessonName}`;
            return localStorage.getItem(savedKey) === 'true';
        }
        
        function markAttendance(lessonName, reward, buttonElement) {
            const savedKey = `marked_${currentDay}_${lessonName}`;
            
            if (localStorage.getItem(savedKey) === 'true') {
                showBubble("❌ Вы уже отметились на этой паре!", "system");
                return false;
            }
            
            // Сохраняем отметку
            localStorage.setItem(savedKey, 'true');
            
            // Меняем кнопку
            if (buttonElement) {
                buttonElement.textContent = '✓ Отмечено';
                buttonElement.classList.add('marked');
                buttonElement.disabled = true;
            }
            
            modifyIntellectLocally(reward);
            showBubble(`✅ Отмечено на "${lessonName}"! +${reward} интеллекта`, 'character');
            
            return true;
        }
        
        // Создание расписания с привязкой обработчиков (вызывается 1 раз)
        function buildSchedule() {
            const container = document.getElementById('scheduleList');
            if (!container) return;
            
            const schedule = getTodaySchedule();
            
            if (!schedule || schedule.length === 0) {
                container.innerHTML = '<p>Сегодня пар нет. Отдохни или займись расследованием!</p>';
                return;
            }
            
            let html = '';
            for (let lesson of schedule) {
                const isMarked = isLessonMarked(lesson.name);
                html += `
                    <div class="schedule-item">
                        <div class="schedule-info">
                            <span class="schedule-name">📖 ${lesson.name}</span>
                            <span class="schedule-time">🕐 ${lesson.time}</span>
                            <span class="schedule-time">✨ +${lesson.reward} интеллекта</span>
                        </div>
                        <button class="mark-btn ${isMarked ? 'marked' : ''}" 
                                data-lesson="${lesson.name}"
                                data-reward="${lesson.reward}"
                                ${isMarked ? 'disabled' : ''}>
                            ${isMarked ? '✓ Отмечено' : '✎ Отметиться'}
                        </button>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
            // Привязываем обработчики к НЕотмеченным кнопкам
            const buttons = container.querySelectorAll('.mark-btn:not(.marked)');
            buttons.forEach(btn => {
                const lessonName = btn.dataset.lesson;
                const reward = parseInt(btn.dataset.reward);
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    markAttendance(lessonName, reward, this);
                });
            });
        }
        
        // Обновление состояния кнопок без пересоздания
        function updateButtonsState() {
            const buttons = document.querySelectorAll('.mark-btn');
            buttons.forEach(btn => {
                const lessonName = btn.dataset.lesson;
                if (lessonName && isLessonMarked(lessonName) && !btn.classList.contains('marked')) {
                    btn.textContent = '✓ Отмечено';
                    btn.classList.add('marked');
                    btn.disabled = true;
                }
            });
        }
        
        // Обновление только текстовых данных
        function updateUIData() {
            const gameData = getGameData();
            if (!gameData) return;
            
            const gradeSpan = document.getElementById('lastWorkGrade');
            const filesStatus = document.getElementById('filesStatus');
            const warningBanner = document.getElementById('warningBanner');
            
            if (gameData.day === 1 && !gameData.completedDays?.includes(1)) {
                if (gradeSpan) gradeSpan.textContent = '2';
                if (filesStatus) filesStatus.textContent = 'пусто (ошибка загрузки)';
                if (warningBanner) warningBanner.innerHTML = '⚠️ ОШИБКА: Файл не найден в очереди загрузки!';
            } else if (gameData.day >= 2 && gameData.completedDays?.includes(1)) {
                if (gradeSpan) gradeSpan.innerHTML = '2 <span style="font-size:10px">(ожидает API)</span>';
                if (filesStatus) filesStatus.innerHTML = '✅ Курсовая_работа.pdf (отправлено)';
                if (warningBanner) warningBanner.innerHTML = '⚠️ API ОЦЕНИВАНИЯ НЕ ОТВЕЧАЕТ (502)';
            }
            
            if (gameData.day >= 3 && gameData.completedDays?.includes(2)) {
                if (warningBanner) warningBanner.innerHTML = '⚠️ КЕШ НЕ СИНХРОНИЗИРОВАН! Данные устарели.';
            }
            
            if (gameData.day >= 4 && gameData.completedDays?.includes(3)) {
                if (warningBanner) warningBanner.innerHTML = '⚠️ ОБНАРУЖЕНЫ ПОДОЗРИТЕЛЬНЫЕ ЗАПРОСЫ К API!';
            }
            
            if (gameData.day >= 5 && gameData.completedDays?.includes(4)) {
                if (warningBanner) warningBanner.innerHTML = '🔴 КРИТИЧЕСКОЕ ПРЕДУПРЕЖДЕНИЕ! До отчисления 1 день!';
            }
            
            if (gameData.day >= 6) {
                if (warningBanner) warningBanner.innerHTML = '✅ Система стабильна. Ожидается финальное решение.';
            }
            
            const intellectTip = document.getElementById('intellectTip');
            if (intellectTip && gameData.intellect >= 30) {
                intellectTip.innerHTML = '🤖 DeepSeek доступен! Нажми на иконку на рабочем столе для подсказок.';
                intellectTip.style.background = '#d4ffd4';
                intellectTip.style.color = '#006400';
            }
        }
        
        // Полная перерисовка (при смене дня или VPN)
        let lastDay = 1;
        function fullRender() {
            const container = document.getElementById('diaryContainer');
            if (!container) return;
            
            if (!isLKAccessible()) {
                container.innerHTML = `
                    <div class="error-403">
                        <div class="error-403-icon">🔒</div>
                        <div class="error-403-title">403 Forbidden</div>
                        <div class="error-403-text">Доступ к Личному кабинету заблокирован</div>
                        <div class="error-403-text" style="margin-top: 10px;">Для доступа необходимо выключить VPN</div>
                        <div class="error-403-text" style="margin-top: 5px; font-size: 11px;">Откройте приложение VPN Client и отключите VPN</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="warning-banner" id="warningBanner">
                    ⚠️ ВНИМАНИЕ! Обнаружены проблемы с загрузкой файлов!
                </div>
                
                <h2>Дневник успеваемости</h2>
                <table class="grades-table">
                    <thead>
                        <tr><th>Предмет</th><th>Оценка</th><th>Статус</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Математика</td><td>4</td><td>✅</td></tr>
                        <tr><td>Программирование</td><td>5</td><td>✅</td></tr>
                        <tr><td>Базы данных</td><td>4</td><td>✅</td></tr>
                        <tr id="lastWorkRow"><td>Курсовая работа</td><td id="lastWorkGrade">2</td><td id="lastWorkStatus">⏳ Проверяется</td></tr>
                    </tbody>
                </table>
                
                <div class="schedule-section">
                    <div class="schedule-title">📅 Расписание на сегодня</div>
                    <div id="scheduleList"></div>
                    <div class="intellect-tip" id="intellectTip">
                        💡 Посещай пары, чтобы повышать интеллект! Интеллект открывает доступ к подсказкам DeepSeek.
                    </div>
                </div>
                
                <div class="message-area">
                    <h3>💬 Сообщения</h3>
                    <div class="system-message" id="sentFilesMessage">
                        📁 Отправленные файлы: <span id="filesStatus">загрузка...</span>
                    </div>
                </div>
            `;
            
            buildSchedule();
            updateUIData();
        }
        
        function checkAndUpdate() {
            const gameData = getGameData();
            if (gameData && gameData.day !== lastDay) {
                lastDay = gameData.day;
                fullRender();
            } else {
                // Обновляем только состояние кнопок и текстовые данные
                updateButtonsState();
                updateUIData();
            }
        }
        
        function init() {
            const gameData = getGameData();
            if (gameData) lastDay = gameData.day;
            fullRender();
            
            setInterval(checkAndUpdate, 500);
            
            window.addEventListener('message', (e) => {
                if (e.data.type === 'updateSchedule' || e.data.type === 'vpnToggle') {
                    fullRender();
                }
            });
        }
        
        init();
    </script>
</body>
</html>
