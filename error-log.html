<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал ошибок</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        
        .log-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .log-header {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            font-family: monospace;
        }
        
        .log-entry.error {
            color: #ff6666;
        }
        
        .log-entry.warning {
            color: #ffaa44;
        }
        
        .log-entry.info {
            color: #44ff44;
        }
        
        .log-time {
            color: #888;
            margin-right: 15px;
        }
        
        .log-day {
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 10px;
        }
        
        .filter-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 5px 12px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .filter-btn.active {
            background: #00ff00;
            color: #0a0a0a;
        }
        
        .stats {
            background: #1a1a2e;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        h2 {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="log-container">
        <div class="log-header">
            <h2>SYSLOG: ЖУРНАЛ ОШИБОК</h2>
        </div>
        
        <div class="stats" id="statsPanel"></div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="error">🔴 Ошибки</button>
            <button class="filter-btn" data-filter="warning">🟡 Предупреждения</button>
            <button class="filter-btn" data-filter="info">🟢 Инфо</button>
        </div>
        
        <div id="logList"></div>
    </div>
    
    <script>
        let currentFilter = 'all';
        
        function getGameData() {
            return window.parent.getGameData ? window.parent.getGameData() : null;
        }
        
        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            if (parts.length >= 2) {
                let hours = parseInt(parts[0]) || 0;
                let minutes = parseInt(parts[1]) || 0;
                let seconds = parseInt(parts[2]) || 0;
                return hours * 3600 + minutes * 60 + seconds;
            }
            return 0;
        }
        
        function getSystemLogs() {
            const gameData = getGameData();
            const errors = gameData?.errorLog || [];
            const completedDays = gameData?.completedDays || [];
            
            const systemLogs = [];
            
            // День 1 логи
            if (gameData?.day >= 1) {
                systemLogs.push({ type: 'error', day: 1, time: '14:00:23', timestamp: 14*3600 + 0*60 + 23, message: 'ERR_UPLOAD_404: Файл не найден в очереди загрузки' });
                if (completedDays.includes(1)) {
                    systemLogs.push({ type: 'info', day: 1, time: '14:30:12', timestamp: 14*3600 + 30*60 + 12, message: 'INFO: Проблема с очередью решена' });
                }
            }
            
            // День 2 логи
            if (gameData?.day >= 2) {
                systemLogs.push({ type: 'error', day: 2, time: '09:30:12', timestamp: 9*3600 + 30*60 + 12, message: 'ERR_502: API /grades не отвечает' });
                if (completedDays.includes(2)) {
                    systemLogs.push({ type: 'info', day: 2, time: '10:15:22', timestamp: 10*3600 + 15*60 + 22, message: 'INFO: API шлюз перезапущен' });
                }
            }
            
            // День 3 логи
            if (gameData?.day >= 3) {
                systemLogs.push({ type: 'error', day: 3, time: '08:20:05', timestamp: 8*3600 + 20*60 + 5, message: 'ERR_CACHE: Инвалидация кеша не удалась' });
                if (completedDays.includes(3)) {
                    systemLogs.push({ type: 'info', day: 3, time: '09:05:33', timestamp: 9*3600 + 5*60 + 33, message: 'INFO: Кеш сброшен' });
                }
            }
            
            // День 4 логи
            if (gameData?.day >= 4) {
                systemLogs.push({ type: 'warning', day: 4, time: '10:05:42', timestamp: 10*3600 + 5*60 + 42, message: 'WARN: Запросы к Telegram/YouTube API' });
                if (completedDays.includes(4)) {
                    systemLogs.push({ type: 'info', day: 4, time: '11:20:15', timestamp: 11*3600 + 20*60 + 15, message: 'INFO: Проверка VPN отключена' });
                }
            }
            
            // День 5 логи
            if (gameData?.day >= 5 && !completedDays.includes(5)) {
                systemLogs.push({ type: 'warning', day: 5, time: '09:00:00', timestamp: 9*3600, message: 'WARN: Административный риск - критический' });
            }
            
            if (completedDays.includes(5)) {
                systemLogs.push({ type: 'info', day: 5, time: '09:30:00', timestamp: 9*3600 + 30*60, message: 'INFO: Отчёт принят, угроза снята' });
            }
            
            const userLogs = errors.map(e => {
                let type = e.result === 'исправлена' ? 'info' : 'error';
                let message = `[${e.action}] ${e.message}`;
                let timeValue = e.timestamp || '12:00:00';
                let timestampSec = parseTime(timeValue);
                return {
                    type: type,
                    day: e.day,
                    time: timeValue,
                    timestamp: timestampSec,
                    message: message
                };
            });
            
            let allLogs = [...systemLogs, ...userLogs];
    
            allLogs.sort((a, b) => {
                if (a.day !== b.day) return a.day - b.day;
                return a.timestamp - b.timestamp;
            });
            
            return allLogs;
        }
        
        function renderLogs() {
            const logs = getSystemLogs();
            const filteredLogs = currentFilter === 'all' ? logs : logs.filter(l => l.type === currentFilter);
            
            const logDiv = document.getElementById('logList');
            const statsPanel = document.getElementById('statsPanel');
            
            const errorCount = logs.filter(l => l.type === 'error').length;
            const warningCount = logs.filter(l => l.type === 'warning').length;
            const infoCount = logs.filter(l => l.type === 'info').length;
            
            if (statsPanel) {
                statsPanel.innerHTML = `СТАТИСТИКА | 🔴 Ошибок: ${errorCount} | 🟡 Предупреждений: ${warningCount} | 🟢 Событий: ${infoCount}`;
            }
            
            if (!logDiv) return;
            
            if (filteredLogs.length === 0) {
                logDiv.innerHTML = '<div class="log-entry">Нет записей</div>';
                return;
            }
            
            logDiv.innerHTML = filteredLogs.map(log => `
                <div class="log-entry ${log.type}">
                    <span class="log-time">[${log.time || '--:--:--'}]</span>
                    <span class="log-day">День ${log.day}</span>
                    <span>${log.message}</span>
                </div>
            `).join('');
        }
        
        function init() {
            renderLogs();
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderLogs();
                });
            });
            
            setInterval(renderLogs, 2000);
        }
        
        init();
    </script>
</body>
</html>
