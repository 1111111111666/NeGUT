<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив данных</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #fff4de;
        }
        
        .archive-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .timeline {
            color: #442200;
            padding: 15px;
            margin: 20px 0;
            border: 4px solid #ffcc77;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .timeline-item {
            padding: 10px;
            border-left: 4px solid #442200;
            margin: 10px 0;
            background: rgba(255,255,255,0.3);
        }
        
        .timeline-item.resolved {
            background: rgba(0,100,0,0.3);
            border-left-color: #00aa00;
        }
        
        hr {
            margin: 20px 0;
            border: 2px solid #ffaa44;
        }
        
        .report-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            width: 100%;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
        }
        
        .report-btn:hover {
            background: #c0392b;
        }
        
        .report-btn:disabled {
            background: #ccaa66;
            cursor: not-allowed;
        }
        
        h2, h3 {
            color: #442200;
            background: #ffcc77;
            display: inline-block;
            padding: 6px 12px;
            margin-bottom: 12px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .stats-badge {
            background: #ffcc77;
            padding: 10px;
            margin-bottom: 15px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .log-card {
            background: #ffffee;
            border: 4px solid #ffaa44;
            padding: 15px;
            margin: 10px 0;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .log-card h4 {
            color: #442200;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .log-card .result-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .log-card .result-badge.success {
            background: #27ae60;
            color: white;
        }
        
        .log-card .result-badge.failure {
            background: #e74c3c;
            color: white;
        }
        
        .log-card .result-badge.clue {
            background: #f39c12;
            color: white;
        }
        
        .log-card .command {
            font-family: monospace;
            background: #ffeedd;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin: 5px 0;
        }
        
        .log-card .explanation {
            margin-top: 10px;
            padding: 8px;
            background: #fff8e8;
            border-left: 3px solid #ffaa44;
            font-size: 12px;
            color: #664400;
        }
        
        .log-card .stats-delta {
            font-size: 11px;
            color: #886633;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <h2>Архив данных / Хранилище ошибок</h2>
        
        <div class="stats-badge" id="statsBadge">
            <!-- здесь будет cтатистика -->
        </div>
        
        <div class="timeline">
            <h3>📅 Таймлайн расследования</h3>
            <div id="timelineContent"></div>
        </div>
        
        <hr>
        
        <h3>🔍 Журнал ошибок и улики</h3>
        <div id="errorLogList"></div>
        
    </div>
    
    <script>
        function getGameData() {
            return window.parent.getGameData ? window.parent.getGameData() : null;
        }
        
        function updateGameData(data) {
            if (window.parent.updateGameData) {
                window.parent.updateGameData(data);
            }
        }
        
        function showBubble(text, type) {
            if (window.parent.showBubble) {
                window.parent.showBubble(text, type);
            }
        }
        
        function renderStats() {
            const gameData = getGameData();
            const statsDiv = document.getElementById('statsBadge');
            if (!statsDiv || !gameData) return;
            
            const successCount = gameData.errorLog.filter(e => e.result === 'исправлена').length;
            const clueCount = gameData.clues?.length || 0;
            
            statsDiv.innerHTML = `
                <strong>ТЕКУЩАЯ СТАТИСТИКА:</strong><br>
                ♥ Доверие: ${gameData.trust}% | ★ Интеллект: ${gameData.intellect}<br>
                📅 Текущий день: ${gameData.day} | Решено дней: ${gameData.completedDays?.length || 0}/5<br>
                🔍 Улик собрано: ${clueCount} | Успешных действий: ${successCount}
            `;
        }
        
        function renderTimeline() {
            const gameData = getGameData();
            const timelineDiv = document.getElementById('timelineContent');
            if (!timelineDiv) return;
            
            const completedDays = gameData?.completedDays || [];
            const dayNames = {
                1: 'День 1: Пропажа отправленного файла',
                2: 'День 2: API оценивания не работает',
                3: 'День 3: Интерфейс показывает старые данные',
                4: 'День 4: Проверка VPN через API',
                5: 'День 5: Угроза отчисления'
            };
            
            const allDays = [1, 2, 3, 4, 5];
            
            timelineDiv.innerHTML = allDays.map(day => `
                <div class="timeline-item ${completedDays.includes(day) ? 'resolved' : ''}">
                    <strong>${dayNames[day] || `День ${day}`}</strong>
                    ${completedDays.includes(day) ? ' - ✅ РЕШЕНО' : ' - ⏳ ОЖИДАЕТ РЕШЕНИЯ'}
                </div>
            `).join('');
        }
        
        function renderErrorLog() {
            const gameData = getGameData();
            const logDiv = document.getElementById('errorLogList');
            if (!logDiv) return;
            
            const errors = gameData?.errorLog || [];
            const clues = gameData?.clues || [];
            
            if (errors.length === 0 && clues.length === 0) {
                logDiv.innerHTML = '<div class="log-card"><p>Журнал ошибок пуст. Выполните команды в терминале.</p></div>';
                return;
            }
            
            let html = '';
            
            errors.slice(0, 20).forEach(err => {
                const resultClass = err.result === 'исправлена' ? 'success' : (err.result === 'не исправлена' ? 'failure' : 'clue');
                const resultText = err.result === 'исправлена' ? '✅ ' + err.result : (err.result === 'не исправлена' ? '❌ ' + err.result : '🔍 ' + err.result);
                
                html += `
                    <div class="log-card">
                        <h4>
                            [День ${err.day}] ${err.timestamp || ''}
                            <span class="result-badge ${resultClass}">${resultText}</span>
                        </h4>
                        <div class="command">📌 Команда: ${err.action}</div>
                        <p>${err.message}</p>
                        <div class="explanation">
                            <strong>Почему так произошло?</strong><br>${err.explanation || 'Нет дополнительного объяснения.'}
                        </div>
                        <div class="stats-delta">
                            ${err.trustDelta !== 0 ? (err.trustDelta > 0 ? `♥ Доверие +${err.trustDelta}` : `♥ Доверие ${err.trustDelta}`) : ''}
                            ${err.intellectDelta !== 0 ? (err.intellectDelta > 0 ? ` | ★ Интеллект +${err.intellectDelta}` : ` | ★ Интеллект ${err.intellectDelta}`) : ''}
                        </div>
                    </div>
                `;
            });
            
            if (clues.length > 0) {
                html += `<h3 style="margin-top: 20px;">🔍 Собранные улики</h3>`;
                clues.forEach(clue => {
                    html += `
                        <div class="log-card">
                            <h4>
                                Улика
                                <span class="result-badge clue">НАЙДЕНО</span>
                            </h4>
                            <p>${clue}</p>
                            <div class="explanation">
                                💡 Эта улика поможет в финальном расследовании!
                            </div>
                        </div>
                    `;
                });
            }
            
            logDiv.innerHTML = html;
        }
        
        function init() {
            renderStats();
            renderTimeline();
            renderErrorLog();
            
            setInterval(() => {
                renderStats();
                renderTimeline();
                renderErrorLog();
            }, 2000);
        }
        
        init();
    </script>
</body>
</html>
