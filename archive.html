<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив данных</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #fff4de;
        }
        
        .archive-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .clue-card {
            background: #ffffee;
            border: 4px solid #ffaa44;
            padding: 15px;
            margin: 10px 0;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .clue-card h4 {
            color: #442200;
            margin-bottom: 8px;
        }
        
        .timeline {
            background: #ffaa44;
            color: #442200;
            padding: 15px;
            margin: 20px 0;
            border: 4px solid #ffcc77;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .timeline-item {
            padding: 10px;
            border-left: 4px solid #442200;
            margin: 10px 0;
            background: rgba(255,255,255,0.3);
        }
        
        .timeline-item.resolved {
            background: rgba(0,100,0,0.3);
            border-left-color: #00aa00;
        }
        
        hr {
            margin: 20px 0;
            border: 2px solid #ffaa44;
        }
        
        .report-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            width: 100%;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
        }
        
        .report-btn:hover {
            background: #c0392b;
        }
        
        .report-btn:disabled {
            background: #ccaa66;
            cursor: not-allowed;
        }
        
        h2, h3 {
            color: #442200;
            background: #ffcc77;
            display: inline-block;
            padding: 6px 12px;
            margin-bottom: 12px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
        
        .stats-badge {
            background: #ffcc77;
            padding: 10px;
            margin-bottom: 15px;
            clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <h2>📚 Архив данных / Хранилище ошибок</h2>
        
        <div class="stats-badge" id="statsBadge">
            <!-- Статистика будет здесь -->
        </div>
        
        <div class="timeline">
            <h3>📅 Таймлайн расследования</h3>
            <div id="timelineContent"></div>
        </div>
        
        <h3>🔍 Собранные улики</h3>
        <div id="cluesList"></div>
        
        <hr>
        
        <h3>⚠️ Журнал ошибок системы</h3>
        <div id="errorLogList"></div>
        
        <button id="prepareReportBtn" class="report-btn">📄 Подготовить отчёт для преподавателя</button>
    </div>
    
    <script>
        function getGameData() {
            return window.parent.getGameData ? window.parent.getGameData() : null;
        }
        
        function updateGameData(data) {
            if (window.parent.updateGameData) {
                window.parent.updateGameData(data);
            }
        }
        
        function showBubble(text, type) {
            if (window.parent.showBubble) {
                window.parent.showBubble(text, type);
            }
        }
        
        function renderStats() {
            const gameData = getGameData();
            const statsDiv = document.getElementById('statsBadge');
            if (!statsDiv || !gameData) return;
            
            statsDiv.innerHTML = `
                📊 ТЕКУЩАЯ СТАТИСТИКА:<br>
                ❤️ Доверие: ${gameData.trust}% | 🧠 Интеллект: ${gameData.intellect}<br>
                📅 Текущий день: ${gameData.day} | ✅ Решено дней: ${gameData.completedDays?.length || 0}/5
            `;
        }
        
        function renderClues() {
            const gameData = getGameData();
            const cluesDiv = document.getElementById('cluesList');
            if (!cluesDiv) return;
            
            const clues = gameData?.clues || [];
            if (clues.length === 0) {
                cluesDiv.innerHTML = '<div class="clue-card"><p>🔍 Пока нет собранных улик. Используйте терминал в панели администратора.</p></div>';
                return;
            }
            
            cluesDiv.innerHTML = clues.map(clue => `
                <div class="clue-card">
                    <h4>🔍 Улика</h4>
                    <p>${clue}</p>
                </div>
            `).join('');
        }
        
        function renderTimeline() {
            const gameData = getGameData();
            const timelineDiv = document.getElementById('timelineContent');
            if (!timelineDiv) return;
            
            const completedDays = gameData?.completedDays || [];
            const dayNames = {
                1: '📁 День 1: Пропажа отправленного файла',
                2: '🔌 День 2: API оценивания не работает',
                3: '💾 День 3: Интерфейс показывает старые данные',
                4: '🌐 День 4: Проверка VPN через API',
                5: '📋 День 5: Угроза отчисления'
            };
            
            const allDays = [1, 2, 3, 4, 5];
            
            timelineDiv.innerHTML = allDays.map(day => `
                <div class="timeline-item ${completedDays.includes(day) ? 'resolved' : ''}">
                    <strong>${dayNames[day] || `День ${day}`}</strong>
                    ${completedDays.includes(day) ? ' - ✅ РЕШЕНО' : ' - ⏳ ОЖИДАЕТ РЕШЕНИЯ'}
                </div>
            `).join('');
        }
        
        function renderErrorLog() {
            const gameData = getGameData();
            const logDiv = document.getElementById('errorLogList');
            if (!logDiv) return;
            
            const errors = gameData?.errorLog || [];
            if (errors.length === 0) {
                logDiv.innerHTML = '<div class="clue-card"><p>Журнал ошибок пуст. Выполните команды в терминале.</p></div>';
                return;
            }
            
            logDiv.innerHTML = errors.slice(0, 20).map(err => `
                <div class="clue-card">
                    <h4>⚠️ [День ${err.day}] ${err.timestamp || ''}</h4>
                    <p>📌 Команда: ${err.action}</p>
                    <p>📊 Результат: ${err.result === 'исправлена' ? '✅ ' + err.result : '❌ ' + err.result}</p>
                    <p>💬 ${err.message}</p>
                </div>
            `).join('');
        }
        
        function prepareReport() {
            const gameData = getGameData();
            if (!gameData) return;
            
            if (gameData.day < 5 && !gameData.completedDays.includes(4)) {
                showBubble('❌ Сначала решите все проблемы дней 1-4!', 'system');
                return;
            }
            
            if (!gameData.completedDays.includes(4)) {
                showBubble('❌ Сначала решите проблему дня 4!', 'system');
                return;
            }
            
            if (gameData.completedDays.includes(5)) {
                showBubble('📋 Отчёт уже подготовлен!', 'system');
                return;
            }
            
            // Выполняем команду report.generate
            if (window.parent.executeCommand) {
                window.parent.executeCommand('report.generate');
            }
        }
        
        function init() {
            renderStats();
            renderClues();
            renderTimeline();
            renderErrorLog();
            
            const reportBtn = document.getElementById('prepareReportBtn');
            if (reportBtn) {
                reportBtn.addEventListener('click', prepareReport);
            }
            
            setInterval(() => {
                renderStats();
                renderClues();
                renderTimeline();
                renderErrorLog();
            }, 2000);
        }
        
        init();
    </script>
</body>
</html>
